name: civicAPI audit – accuracy and speed vs. state results

# Every 60 s: poll civicAPI and the official Georgia and North Carolina results sites for the same races
# (scripts/audit.mjs), then every 5 minutes commit data/audit/report.json for the /audit/ page.
# The full history of counts is saved to the audit-raw branch every 15 minutes. No AI involved.

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Only run 2 polls a minute apart and print what each source returned (no commits)'
        type: boolean
        default: false
      hours:
        description: 'How long to keep polling'
        default: '5.2'
  schedule:
    - cron: '50 23 3 11 *'   # 6:50 pm ET Nov 3

concurrency:
  group: civic-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test (2 polls)
        if: ${{ inputs.selftest }}
        run: |
          node scripts/audit.mjs
          sleep 60
          node scripts/audit.mjs
          echo "---- report (first 4000 chars) ----"
          head -c 4000 data/audit/report.json
      - name: Poll every minute
        if: ${{ !inputs.selftest }}
        run: |
          git config user.name "civic-audit-bot"
          git config user.email "civic-audit-bot@users.noreply.github.com"
          HOURS="${{ inputs.hours || '5.2' }}"
          git fetch -q origin audit-raw && git worktree add -q -B audit-raw /tmp/araw origin/audit-raw || \
            { git worktree add -q -B audit-raw /tmp/araw HEAD && git -C /tmp/araw rm -rq . && git -C /tmp/araw commit -qm "Start audit history"; }
          end=$(( $(date +%s) + $(awk "BEGIN{print int($HOURS*3600)}") ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            node scripts/audit.mjs | head -8 || echo "::warning::audit tick failed"
            n=$((n+1))
            if [ $((n % 5)) -eq 0 ]; then
              git add data/audit/report.json
              if ! git diff --cached --quiet; then
                git commit -q -m "civicAPI audit report $(date -u +%H:%MZ)"
                for i in 1 2 3 4 5; do
                  git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main && break
                  sleep $((i*3))
                done
              fi
            fi
            if [ $((n % 15)) -eq 0 ] && [ -f /tmp/audit/state.json ]; then
              gzip -c /tmp/audit/state.json > /tmp/araw/state-$(date -u +%H%M).json.gz
              git -C /tmp/araw add -A && git -C /tmp/araw commit -qm "audit history $(date -u +%H:%MZ)" && git -C /tmp/araw push -q origin audit-raw || echo "::warning::history push failed"
            fi
            sleep $(( 60 - ($(date +%s) - t0) > 5 ? 60 - ($(date +%s) - t0) : 5 ))
          done
