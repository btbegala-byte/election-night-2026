name: County Targets – Claude blurbs

# Every ~5-7 minutes on election night: pull county results from civicAPI, compute each county's
# verdict vs. win pace (county/engine.js), have Claude Code write the county notes and outlooks,
# and commit data/model/blurbs.json. Also writes race snapshots (data/model/snapshots.json, an append-only log). Uses the Max-plan token in the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Only check that the Claude token works, then stop'
        type: boolean
        default: false
      aptest:
        description: 'Only test the AP race-call checker once (no commits)'
        type: boolean
        default: false
      hours:
        description: 'How long to keep looping (max 5.7)'
        default: '5.6'
  schedule:
    - cron: '40 23 3 11 *'   # 6:40 pm ET Nov 3
    - cron: '15 5 4 11 *'    # 12:15 am ET Nov 4 (second shift; waits for the first to finish)

concurrency:
  group: county-blurbs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  blurbs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Clean up the token
        run: |
          # strip line breaks, spaces and stray quotes that sneak in when a long token is copied from Terminal
          t=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'"'')
          echo "::add-mask::$t"
          case "$t" in sk-ant-oat01-*) pre=yes ;; *) pre=no ;; esac
          echo "Token length after cleanup: ${#t} (raw ${#RAW_TOKEN}); starts with sk-ant-oat01-: $pre"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Check the Claude token
        run: |
          out=$(echo "Reply with exactly the word OK" | claude -p --model sonnet 2>&1 || true)
          echo "Claude replied: $out"
          echo "$out" | grep -q "OK" || { echo "::error::Claude token check failed. County pages will fall back to template sentences."; exit 1; }
      - name: AP checker test
        if: ${{ inputs.aptest }}
        run: |
          node scripts/county_blurbs.mjs > /dev/null || true
          echo "Using web search, find the race call The Associated Press made in the November 2024 Pennsylvania U.S. Senate race. Reply with one line: winner name, then the source URL." | claude -p --model sonnet --output-format text --allowedTools WebSearch WebFetch || true
          CT_NOW=2026-11-04T03:00:00Z node scripts/ap_calls.mjs
          cat data/model/ap_calls.json | head -c 3000
      - name: Loop
        if: ${{ !inputs.selftest && !inputs.aptest }}
        run: |
          git config user.name "county-targets-bot"
          git config user.email "county-targets-bot@users.noreply.github.com"
          HOURS="${{ inputs.hours || '5.6' }}"
          # raw civicAPI archive lives on its own branch so it never triggers a Pages build
          git fetch -q origin archive && git worktree add -q -B archive /tmp/arch origin/archive || \
            { git worktree add -q -B archive /tmp/arch HEAD && git -C /tmp/arch rm -rq . && git -C /tmp/arch commit -qm "Start raw civicAPI archive"; }
          export CT_ARCHIVE_DIR=/tmp/archive_out
          end=$(( $(date +%s) + $(awk "BEGIN{print int($HOURS*3600)}") ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull --rebase --autostash --quiet origin main || git rebase --abort || true
            node scripts/county_blurbs.mjs || echo "::warning::blurb run failed"
            # AP race-call check runs in the background so a slow web search never delays the notes
            if [ -f /tmp/ct_raw.json ] && ! { [ -f /tmp/ap.pid ] && kill -0 "$(cat /tmp/ap.pid)" 2>/dev/null; }; then
              cat /tmp/ap.log 2>/dev/null | tail -5 || true
              ( node scripts/ap_calls.mjs > /tmp/ap.log 2>&1 ) & echo $! > /tmp/ap.pid
            fi
            if ls /tmp/archive_out/*.json.gz >/dev/null 2>&1; then
              mkdir -p /tmp/arch/raw && mv /tmp/archive_out/*.json.gz /tmp/arch/raw/
              git -C /tmp/arch add raw && git -C /tmp/arch commit -qm "Raw civicAPI archive $(date -u +%H:%MZ)" && git -C /tmp/arch push -q origin archive || echo "::warning::archive push failed"
            fi
            if [ -f data/model/blurbs.json ] || [ -f data/model/snapshots.json ] || [ -f data/model/ap_calls.json ]; then
              for f in data/model/blurbs.json data/model/snapshots.json data/model/ap_calls.json; do [ -f "$f" ] && git add "$f"; done
              if ! git diff --cached --quiet; then
                git commit -q -m "AI notes + race snapshots $(date -u +%H:%MZ)"
                for i in 1 2 3 4 5; do
                  git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main && break
                  sleep $((i*4))
                done
              fi
            fi
            sleep 300
          done
