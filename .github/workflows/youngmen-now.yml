name: Exit polls – young men (run now)

# One-off pull of the young men (18-29) exit poll numbers, outside the main election-night loop.
# Actions tab > "Exit polls – young men (run now)" > Run workflow. Commits data/model/youngmen.json.

on:
  workflow_dispatch:

concurrency:
  group: youngmen-now
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youngmen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Clean up the token
        run: |
          t=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'"'')
          echo "::add-mask::$t"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Pull young men exit poll numbers
        run: |
          node scripts/youngmen.mjs --force
          head -c 3000 data/model/youngmen.json; echo
      - name: Commit
        run: |
          git config user.name "county-targets-bot"
          git config user.email "county-targets-bot@users.noreply.github.com"
          git add data/model/youngmen.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Young men exit poll numbers (manual pull) $(date -u +%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main && break
              sleep $((i*4))
            done
          fi
